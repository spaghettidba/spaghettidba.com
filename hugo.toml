baseURL = "https://spaghettidba.com/"
locale = "en-US"
title = "spaghettidba"
theme = "beautifulhugo"
enableRobotsTXT = true

[module.hugoVersion]
  min = "0.167.0"

[services.rss]
  limit = 10

[params]
  description = "Italian recipes for your daily database cooking"
  subtitle = "Italian recipes for your daily database cooking"
  homeTitle = "spaghettidba"
  favicon = "/favicon.ico?v=two-cents"
  mainSections = ["posts"]
  dateFormat = "January 2, 2006"
  comments = true
  socialShare = false
  useHLJS = false
  showRelatedPosts = true
  readingTime = true
  wordCount = false

[[params.bigimg]]
  src = "/images/spaghettidba-header.png"

[params.author]
  name = "spaghettidba"
  website = "https://spaghettidba.com"

[permalinks]
  posts = "/:year/:month/:day/:slug/"
  categories = "/category/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "Atom"]

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.Atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  rel = "alternate"

[menu]
  [[menu.explore]]
    name = "XESmartTarget recipes"
    pageRef = "/posts/1554-10-dba-recipes-with-xesmarttarget"
    weight = 1

  [[menu.explore]]
    name = "XESmartTarget"
    pageRef = "/tags/xesmarttarget"
    weight = 2

  [[menu.explore]]
    name = "WorkloadTools"
    pageRef = "/tags/workloadtools"
    weight = 3

  [[menu.main]]
    name = "Blog"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  guessSyntax = true
  noClasses = false
