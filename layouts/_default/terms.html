{{ define "main" }}
  <div class="container blog-layout" role="main">
    <aside class="blog-sidebar" aria-label="Blog navigation">
      {{ partialCached "sidebar.html" .Site .Site.Language.Lang }}
    </aside>
    <div class="blog-content">
      <article class="post-preview">
        <div class="panel-group" id="accordion">
          {{ range .Data.Terms.ByCount }}
            {{ $id := printf "collapse%s" (.Name | anchorize) }}
            <div class="panel panel-default">
              <a href="#{{ $id }}" class="collapsed" role="button" data-toggle="collapse" data-target="#{{ $id }}" data-parent="#accordion" aria-expanded="false" aria-controls="{{ $id }}">
                <div class="panel-heading" id="header{{ .Name | anchorize }}">
                  <h4 class="panel-title">{{ .Page.LinkTitle }} <span class="badge">{{ .Count }}</span></h4>
                </div>
              </a>
              <div id="{{ $id }}" class="panel-collapse collapse">
                <div class="panel-body">
                  <a href="{{ .Page.RelPermalink }}" class="list-group-item view-all">View all</a>
                  <div class="list-group">
                    {{ range .WeightedPages }}
                      <a href="{{ .Permalink }}" class="list-group-item">{{ .Title }}</a>
                    {{ end }}
                  </div>
                </div>
              </div>
            </div>
          {{ end }}
        </div>
      </article>
    </div>
  </div>
{{ end }}
